# NekoSportsWorldTool 自动发布
#
# 触发方式：
#   ① 推送 tag：git tag v0.8.0 && git push origin v0.8.0  → 构建并发布桌面产物
#   ② 手动：    Actions 页面 Run workflow（可选 full/cli 模式，只出构建产物，不发布）
#
# 自 0.8.0 起桌面端发布 **Windows x64 + Linux（x64 / arm64，CLI-only）**，macOS 停发。
# Android APK 由 apk.yml 单独发布到同一个 Release。
#
# 注意：本文件需位于仓库根 .github/workflows/ 下
#（若仓库根就是 gui-rs 目录内容则无需调整；否则把 .github 移到仓库根）。
#
# Release 说明：workflow 已开启 generate_release_notes（按 commits 自动生成
# What's Changed），并附加固定的平台下载说明；如需自定义可在仓库根放

name: Release

# 矩阵当前是 Windows x64 + Linux x64 + Linux arm64；macOS 自 0.8.0 起停发（条目已注释）。
# tag 推送时才发布到 Release，手动运行只产出 artifact。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      mode:
        description: 构建模式
        type: choice
        default: full
        options: [full, cli]

# 权限按 job 收窄：构建只需要读仓库；只有发布 job 申请 contents: write。
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 自 0.8.0 起桌面端发布 Windows x64 + Linux（x64 / arm64，CLI-only，与历史一致）；
          # macOS 停止发布（既无签名，也没有真实用户验证过）。需要时把注释掉的条目恢复。
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            mode: full
            artifact: NekoSportsWorldTool-win-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            mode: cli
            artifact: NekoSportsWorldTool-linux-x64
            cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            mode: cli
            artifact: NekoSportsWorldTool-linux-aarch64
            cross: true
          # - os: macos-latest
          #   target: aarch64-apple-darwin
          #   mode: full
          #   artifact: NekoSportsWorldTool-macos-arm64
    runs-on: ${{ matrix.os }}
    env:
      MODE: ${{ github.event.inputs.mode || matrix.mode }}
      TARGET: ${{ matrix.target }}
      ARTIFACT: ${{ matrix.artifact }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux 交叉编译)
        if: matrix.cross == true
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: cross

      - name: Build (CLI-only)
        if: env.MODE == 'cli'
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target "$TARGET" --no-default-features
          else
            cargo build --release --target "$TARGET" --no-default-features
          fi
        shell: bash

      - name: Build (full = GUI + CLI)
        if: env.MODE == 'full'
        run: cargo build --release --target "$TARGET"
        shell: bash

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          BIN=target/$TARGET/release/nekosportsworldtool
          if [ "${{ matrix.os }}" = "windows-latest" ]; then BIN="$BIN.exe"; fi
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a "dist/$ARTIFACT.zip" "$BIN"
          else
            tar czf "dist/$ARTIFACT.tar.gz" -C "$(dirname "$BIN")" "$(basename "$BIN")"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  release:
    needs: build
    # 只有「push tag」才发布产物。手动 Run workflow 时即使把 ref 选成某个 tag，
    # `github.event_name` 仍是 workflow_dispatch，因此不会往 Release 里塞桌面文件
    # ——只写 startsWith(github.ref,'refs/tags/') 时，手动选 tag 会误发。
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # 只有这个 job 需要写权限：四个平台的构建 job 都拿不到它。
    # id-token / attestations 用于生成可验证的构建来源证明。
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: 生成校验和
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS-desktop.txt -exec sha256sum {} + | sed 's#\./##' | sort > SHA256SUMS-desktop.txt
          cat SHA256SUMS-desktop.txt

      - name: 生成构建来源证明
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/*

      - name: Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          append_body: true
          body: |
            ### 桌面产物（Windows x64 / Linux x64 / Linux arm64）

            自 0.8.0 起桌面端发布 Windows x64 与 Linux（x64 / arm64），不再发布 macOS
            （最后可用版本为 v0.7.0）。

            - **Linux 产物是 CLI-only**（不含 GUI），与历史版本一致；图形界面请用
              Windows 版或 Android 版。
            - Windows 二进制**没有** Authenticode 签名（未购买证书），首次运行会提示
              "未知发布者"，这是预期行为。

            请用产物来源证明与校验和确认真实性：

            ```bash
            sha256sum -c SHA256SUMS-desktop.txt
            gh attestation verify NekoSportsWorldTool-win-x64.zip --repo ${{ github.repository }}
            ```

            官方 Linux 产物是 CLI-only（不含 GUI）。
